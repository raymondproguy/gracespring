name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.mod
      - run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './design/*'))"
      - run: go tool sqlc generate -f sqlc.yaml
        working-directory: apps/api
      - run: git diff --exit-code -- internal/platform/dbgen
        working-directory: apps/api
      - run: go vet ./...
        working-directory: apps/api
      - run: go test ./...
        working-directory: apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
