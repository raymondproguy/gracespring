<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create PIN · GraceSpring</title>
<meta name="description" content="GraceSpring Family Church: worship, prayer, events and community.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,500;0,600;1,500&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/glass.css">

<script>try{var t=localStorage.getItem('gs-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
</head>
<body class="no-tabbar lockpage">
<main class="cover lock">
  <img class="bg" src="assets/img/church.jpg" alt="">
  <a class="icon-btn back-glass" href="lock-setup.html" aria-label="Back"><svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
  <div class="lock-card pin-card" data-pin-mode="setup">
  <div class="logo-badge sm"><img src="assets/img/mark.png" alt=""></div>
  <h1 data-pin-title>Create a PIN</h1>
  <p data-pin-msg>Enter a 4 digit code you will remember.</p>
  <div class="pin-dots" data-pin-dots><i></i><i></i><i></i><i></i></div>
  <div class="keypad" data-keypad><button type="button" class="key" data-key="1"><b>1</b><small></small></button><button type="button" class="key" data-key="2"><b>2</b><small>ABC</small></button><button type="button" class="key" data-key="3"><b>3</b><small>DEF</small></button><button type="button" class="key" data-key="4"><b>4</b><small>GHI</small></button><button type="button" class="key" data-key="5"><b>5</b><small>JKL</small></button><button type="button" class="key" data-key="6"><b>6</b><small>MNO</small></button><button type="button" class="key" data-key="7"><b>7</b><small>PQRS</small></button><button type="button" class="key" data-key="8"><b>8</b><small>TUV</small></button><button type="button" class="key" data-key="9"><b>9</b><small>WXYZ</small></button><span class="key key-blank"></span><button type="button" class="key" data-key="0"><b>0</b></button><button type="button" class="key key-del" data-key="del" aria-label="Delete"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/></svg></button></div>
</div>
</main>
<script src="js/main.js" defer></script>
<script src="js/features.js" defer></script>
</body>
</html>
