<body class="no-tabbar lockpage">
<main class="cover lock">

  <div class="logo-badge"><img src="assets/img/mark.png" alt="GraceSpring emblem"></div>
  <h1>Welcome back, Raymond</h1>
  <p data-pin-msg>Unlock GraceSpring to continue.</p>
  <button class="bio-btn" type="button" data-bio-unlock hidden><span data-bio-btn-icon></span><b data-bio-btn-label>Unlock with Face ID</b></button>
  <div data-pin-block hidden><div class="pin-dots" data-pin-dots><i></i><i></i><i></i><i></i></div><div class="keypad" data-keypad><button type="button" class="key" data-key="1"><b>1</b><small></small></button><button type="button" class="key" data-key="2"><b>2</b><small>ABC</small></button><button type="button" class="key" data-key="3"><b>3</b><small>DEF</small></button><button type="button" class="key" data-key="4"><b>4</b><small>GHI</small></button><button type="button" class="key" data-key="5"><b>5</b><small>JKL</small></button><button type="button" class="key" data-key="6"><b>6</b><small>MNO</small></button><button type="button" class="key" data-key="7"><b>7</b><small>PQRS</small></button><button type="button" class="key" data-key="8"><b>8</b><small>TUV</small></button><button type="button" class="key" data-key="9"><b>9</b><small>WXYZ</small></button><span class="key key-blank"></span><button type="button" class="key" data-key="0"><b>0</b></button><button type="button" class="key key-del" data-key="del" aria-label="Delete"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/></svg></button></div></div>
  <button class="skip-link" type="button" data-use-pin hidden>Use PIN instead</button>
  <a class="skip-link" href="signin.html" data-forgot>Sign out</a>
</div>
