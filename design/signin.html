<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · GraceSpring</title>
<meta name="description" content="GraceSpring Family Church: worship, prayer, events and community.">
<meta name="theme-color" content="#3b2a96">
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,wght@0,500;0,600;1,500&display=swap">
<link rel="stylesheet" href="css/style.css">
<script>try{var t=localStorage.getItem('gs-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
</head>
<body class="no-tabbar">
<main class="auth">
  <aside class="auth-hero">
    <img class="bg" src="assets/img/church.jpg" alt="">
    <a class="brand" href="index.html"><img src="assets/img/mark.png" alt=""><span><b>GraceSpring</b><small>Family Church</small></span></a>
    <h2>Welcome home.</h2>
    <p>Sign in to pick up where you left off: sermons, prayer, events and your church family.</p>
  </aside>
  <section class="auth-panel">
    <a class="icon-btn back" href="index.html" aria-label="Back"><svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <h1>Welcome back</h1>
    <p class="lede">Sign in to continue to your church community.</p>
    <form action="home.html" class="stack">
      <label class="field"><span>Email or phone number</span>
        <span class="input"><input type="text" name="login" placeholder="you@example.com" autocomplete="username" required></span></label>
      <label class="field"><span>Password</span>
        <span class="input"><input type="password" name="password" placeholder="Your password" autocomplete="current-password" required><button type="button" class="icon-btn" data-pass aria-label="Show password"><span data-eye><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></span><span data-eye-off hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg></span></button></span></label>
      <a class="link forgot" href="#" data-toast="Password reset isn't connected in this preview.">Forgot password?</a>
      <button class="btn btn-block" type="submit">Sign in</button>
      <div class="divider">or</div>
      <a class="btn btn-outline btn-block" href="home.html"><svg class="google-g" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.7v3h3.9c2.3-2.1 3.5-5.2 3.5-8.9z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.1-4 1.1-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.4 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.4a12 12 0 0 0 0 10.8l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.4 6.6l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"/></svg> Continue with Google</a>
    </form>
    <p class="auth-foot">Don't have an account? <a class="link" href="signup.html">Sign up</a></p>
  </section>
</main>
<script src="js/main.js" defer></script>
</body>
</html>
