openapi: 3.1.0
info:
  title: GraceSpring API
  version: 0.1.0
  description: API contract for the GraceSpring Family Church app.
servers:
  - url: http://127.0.0.1:8080
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check whether the API process is responding
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        const: ok
  /ready:
    get:
      operationId: getReadiness
      summary: Check whether required service dependencies are available
      responses:
        "200":
          description: API and required dependencies are ready
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        const: ready
        "503":
          description: One or more required dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/me:
    get:
      operationId: getMe
      summary: Get the authenticated member's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Member profile
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Profile"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Request rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until requests can be retried
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Profile or rate-limit storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/me/avatar:
    put:
      operationId: uploadMyAvatar
      summary: Upload or replace the authenticated member's avatar
      description: Accepts JPEG or PNG images up to 10 MB, re-encodes them to remove embedded metadata, and rejects images above 8 million pixels.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Profile with the new avatar URL
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Profile"
        "400":
          description: Invalid image data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Upload exceeds the 10 MB limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Request rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until requests can be retried
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Image storage failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Profile or rate-limit storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: patchMe
      summary: Update the authenticated member's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePatch"
      responses:
        "200":
          description: Updated member profile
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Profile"
        "400":
          description: Invalid request body or profile field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: Unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Request rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until requests can be retried
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Profile or rate-limit storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Profile:
      type: object
      required: [id, display_name, role, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: [string, "null"]
        display_name:
          type: string
        avatar_url:
          type: [string, "null"]
        bio:
          type: [string, "null"]
        ministry:
          type: [string, "null"]
        role:
          type: string
          enum: [member, leader, admin]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProfilePatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        bio:
          type: string
          maxLength: 160
          description: Send an empty string to clear the bio.
        ministry:
          type: string
          maxLength: 120
          description: Send an empty string to clear the ministry.
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
