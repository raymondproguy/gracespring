version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: dbgen
        out: internal/platform/dbgen
        sql_package: pgx/v5
        emit_interface: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: text
            nullable: true
            go_type:
              type: "*string"
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
